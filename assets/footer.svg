<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90" role="img" aria-label="Still trying.">
  <title>Still trying.</title>
  <defs>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="c"><rect width="1200" height="90" rx="14"/></clipPath>
  </defs>
  <style>
    .glow { animation: glow 4s ease-in-out infinite; }
    @keyframes glow { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    .orbit { animation: orbit 6s linear infinite; transform-origin: 600px 45px; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#c)">
    <rect width="1200" height="90" fill="#000"/>
    <text x="600" y="53" text-anchor="middle" fill="#71717a" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">© 2026 Ali Al Najjar. Still <tspan fill="#3b82f6" font-weight="700" class="glow">try</tspan>ing.</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="89" rx="14" fill="none" stroke="#3b82f6" stroke-opacity=".2"/>
</svg>
